name: CI/CD Pipeline - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tradesignal-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tradesignal-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Backend Container with SHA tag & latest tag
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./trading_2/trade-signal-india/backend
          file: ./trading_2/trade-signal-india/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend Container with SHA tag & latest tag
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./trading_2/trade-signal-india/frontend
          file: ./trading_2/trade-signal-india/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to Live AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.SKIP_DEPLOY != 'true' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          envs: GITHUB_SHA,GITHUB_ACTOR
          script: |
            echo "========================================================"
            echo "🚀 Starting Deployment on EC2 for Commit: ${GITHUB_SHA}"
            echo "========================================================"
            
            # 1. Ensure Project Directory Exists
            mkdir -p ~/trade-signal-india_v2_upgrade
            cd ~/trade-signal-india_v2_upgrade
            
            # 2. Authenticate Docker with GHCR if token provided
            if [ -n "${{ secrets.DEPLOY_TOKEN }}" ]; then
              echo "${{ secrets.DEPLOY_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            fi
            
            # 3. Pull newly built SHA images
            echo "📦 Pulling Backend: ${{ env.BACKEND_IMAGE }}:${GITHUB_SHA}"
            docker pull ${{ env.BACKEND_IMAGE }}:${GITHUB_SHA}
            
            echo "📦 Pulling Frontend: ${{ env.FRONTEND_IMAGE }}:${GITHUB_SHA}"
            docker pull ${{ env.FRONTEND_IMAGE }}:${GITHUB_SHA}
            
            # 4. Generate Production Compose file on EC2 dynamically
            cat << 'EOF' > docker-compose.prod.yml
            version: '3.8'

            services:
              postgres:
                image: postgres:16-alpine
                container_name: tradesignal_postgres
                restart: unless-stopped
                environment:
                  POSTGRES_USER: ${POSTGRES_USER:-postgres}
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
                  POSTGRES_DB: ${POSTGRES_DB:-tradesignal_db}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U postgres"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              redis:
                image: redis:7-alpine
                container_name: tradesignal_redis
                restart: unless-stopped
                volumes:
                  - redis_data:/data
                healthcheck:
                  test: ["CMD", "redis-cli", "ping"]
                  interval: 5s
                  timeout: 5s
                  retries: 5

              backend:
                image: ghcr.io/${GITHUB_USER}/tradesignal-backend:${COMMIT_TAG:-latest}
                container_name: tradesignal_backend
                restart: unless-stopped
                environment:
                  - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tradesignal_db}
                  - REDIS_URL=redis://redis:6379/0
                  - HOST=0.0.0.0
                  - PORT=8000
                ports:
                  - "8000:8000"
                depends_on:
                  postgres:
                    condition: service_healthy
                  redis:
                    condition: service_healthy

              frontend:
                image: ghcr.io/${GITHUB_USER}/tradesignal-frontend:${COMMIT_TAG:-latest}
                container_name: tradesignal_frontend
                restart: unless-stopped
                environment:
                  - PORT=3000
                  - HOSTNAME=0.0.0.0
                ports:
                  - "3000:3000"
                depends_on:
                  - backend

            volumes:
              postgres_data:
              redis_data:
            EOF
            
            # 5. Set Environment Variables
            export GITHUB_USER="${GITHUB_ACTOR}"
            export COMMIT_TAG="${GITHUB_SHA}"
            
            # Save current commit tag for instant rollbacks
            echo "LAST_STABLE_COMMIT=${GITHUB_SHA}" > .last_deployment.env
            
            # 6. Start / Recreate all services with zero-downtime
            docker compose -f docker-compose.prod.yml up -d
            
            # 7. Cleanup old unused image layers to keep EC2 disk light
            docker image prune -f
            
            echo "========================================================"
            echo "✅ Deployment Successful! Live Version: ${GITHUB_SHA}"
            echo "========================================================"
