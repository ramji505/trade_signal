name: CI/CD Pipeline - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tradesignal-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tradesignal-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & Push Backend Container with SHA tag & latest tag
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./trading_2/trade-signal-india/backend
          file: ./trading_2/trade-signal-india/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build & Push Frontend Container with SHA tag & latest tag
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./trading_2/trade-signal-india/frontend
          file: ./trading_2/trade-signal-india/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to Live AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ vars.SKIP_DEPLOY != 'true' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Copy production compose file and helper scripts to EC2
      - name: Copy Docker Compose Template to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml,scripts/"
          target: "~/trade-signal-india_v2_upgrade"

      # 2. Execute zero-downtime rolling deployment on EC2
      - name: Execute Remote SSH Deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          envs: GITHUB_SHA,GITHUB_ACTOR
          script: |
            echo "========================================================"
            echo "🚀 Starting Deployment on EC2 for Commit: ${GITHUB_SHA}"
            echo "========================================================"
            
            cd ~/trade-signal-india_v2_upgrade
            
            # Authenticate Docker with GHCR if deploy token provided
            if [ -n "${{ secrets.DEPLOY_TOKEN }}" ]; then
              echo "${{ secrets.DEPLOY_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
            fi
            
            # Pull newly built SHA images
            echo "📦 Pulling Backend: ${{ env.BACKEND_IMAGE }}:${GITHUB_SHA}"
            docker pull ${{ env.BACKEND_IMAGE }}:${GITHUB_SHA}
            
            echo "📦 Pulling Frontend: ${{ env.FRONTEND_IMAGE }}:${GITHUB_SHA}"
            docker pull ${{ env.FRONTEND_IMAGE }}:${GITHUB_SHA}
            
            # Set Environment Variables for Production Compose
            export GITHUB_USER="${GITHUB_ACTOR}"
            export COMMIT_TAG="${GITHUB_SHA}"
            
            # Save current commit tag for instant rollbacks
            echo "LAST_STABLE_COMMIT=${GITHUB_SHA}" > .last_deployment.env
            
            # Ensure .env exists if needed
            touch .env
            
            # Start / Recreate containers with zero-downtime
            docker compose -f docker-compose.prod.yml up -d
            
            # Cleanup dangling old image layers to keep EC2 disk light
            docker image prune -f
            
            echo "========================================================"
            echo "✅ Deployment Successful! Live Version: ${GITHUB_SHA}"
            echo "========================================================"
